[workspace]
resolver = "2"
members = [
    "crates/shared-types",
    "crates/soul-memory",
    "crates/brain-llm",
    "crates/voice-io",
    "crates/whisper-bridge",
    "src-tauri",
]

[workspace.package]
edition = "2024"
version = "0.2.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
sysinfo = "0.33"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
