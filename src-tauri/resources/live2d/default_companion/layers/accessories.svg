<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="ac_ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#85BEB4"/>
      <stop offset="100%" stop-color="#5B948B"/>
    </linearGradient>
    <linearGradient id="ac_sakura" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB7C2"/>
      <stop offset="100%" stop-color="#EE7D8E"/>
    </linearGradient>
  </defs>

  <!-- Signature Sakura & Gold Star Hairpin on left bangs -->
  <g transform="translate(302, 266) rotate(-22)">
    <rect x="-26" y="-4" width="52" height="8" rx="4" fill="#F4CC72" stroke="#7D582C" stroke-width="2"/>
    <circle cx="0" cy="0" r="11" fill="url(#ac_sakura)" stroke="#7A3C48" stroke-width="2"/>
    <circle cx="-11" cy="-6" r="7" fill="url(#ac_sakura)" stroke="#7A3C48" stroke-width="1.8"/>
    <circle cx="11" cy="-6" r="7" fill="url(#ac_sakura)" stroke="#7A3C48" stroke-width="1.8"/>
    <circle cx="-8" cy="9" r="7" fill="url(#ac_sakura)" stroke="#7A3C48" stroke-width="1.8"/>
    <circle cx="8" cy="9" r="7" fill="url(#ac_sakura)" stroke="#7A3C48" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="4.5" fill="#FFE8A3" stroke="#9B6E2E" stroke-width="1.4"/>
  </g>

  <!-- Collar Jade-Mint Bow Ribbon + Gold Star Charm -->
  <g transform="translate(400, 566)">
    <!-- Ribbon tails -->
    <path d="M -8 6 L -34 54 L -14 48 L -2 12 Z" fill="url(#ac_ribbon)" stroke="#3D635D" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M 8 6 L 34 54 L 14 48 L 2 12 Z" fill="url(#ac_ribbon)" stroke="#3D635D" stroke-width="2.4" stroke-linejoin="round"/>
    <!-- Left & Right bow loops -->
    <path d="M -6 -2 C -26 -18, -48 -14, -46 4 C -44 20, -22 18, -6 5 Z" fill="url(#ac_ribbon)" stroke="#3D635D" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 6 -2 C 26 -18, 48 -14, 46 4 C 44 20, 22 18, 6 5 Z" fill="url(#ac_ribbon)" stroke="#3D635D" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Center knot & dainty gold charm -->
    <rect x="-9" y="-8" width="18" height="16" rx="6" fill="#9ED1C8" stroke="#3D635D" stroke-width="2.4"/>
    <circle cx="0" cy="14" r="5" fill="#F8D27C" stroke="#8C622B" stroke-width="1.8"/>
  </g>
</svg>
