  <path d="M 244 375 C 232 485, 222 585, 245 675" fill="none" stroke="url(#hb_strand)" stroke-width="10" stroke-linecap="round"/>
  <path d="M 556 375 C 568 485, 578 585, 555 675" fill="none" stroke="url(#hb_strand)" stroke-width="10" stroke-linecap="round"/>
  <path d="M 276 470 C 272 560, 276 635, 294 695" fill="none" stroke="#261513" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  <path d="M 524 470 C 528 560, 524 635, 506 695" fill="none" stroke="#261513" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  <path d="M 225 495 Q 400 535 575 495 Q 570 535 400 562 Q 230 535 225 495 Z" fill="url(#hb_glow)"/>
