<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="hb_base" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#4B312C"/>
      <stop offset="45%" stop-color="#3E2723"/>
      <stop offset="100%" stop-color="#2D1B18"/>
    </linearGradient>
    <linearGradient id="hb_strand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B4840" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#3B2521" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="hb_glow" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#A67667" stop-opacity="0"/>
      <stop offset="50%" stop-color="#B98878" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#A67667" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Main silhouette of back hair -->
  <path d="M 400 175
           C 292 175, 224 248, 214 358
           C 205 455, 190 565, 206 668
           C 214 705, 238 725, 248 690
           C 256 720, 282 742, 304 712
           C 324 736, 362 742, 400 738
           C 438 742, 476 736, 496 712
           C 518 742, 544 720, 552 690
           C 562 725, 586 705, 594 668
           C 610 565, 595 455, 586 358
           C 576 248, 508 175, 400 175 Z"
        fill="url(#hb_base)" stroke="#291714" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Outer playful curled tips left & right -->
  <path d="M 218 528 C 188 585, 178 655, 202 702 C 216 680, 228 638, 244 590 Z"
        fill="url(#hb_base)" stroke="#291714" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 582 528 C 612 585, 622 655, 598 702 C 584 680, 572 638, 556 590 Z"
