<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="ir_iris" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#3E2340"/>
      <stop offset="32%" stop-color="#6B3D5E"/>
      <stop offset="70%" stop-color="#BD6B7E"/>
      <stop offset="100%" stop-color="#F6B999"/>
    </linearGradient>
    <radialGradient id="ir_glow" cx="0.5" cy="0.78" r="0.45">
      <stop offset="0%" stop-color="#FFE0B5" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFE0B5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g>
    <!-- Outer iris ring & rich gradient -->
    <ellipse cx="460" cy="356" rx="20" ry="24" fill="url(#ir_iris)" stroke="#2F182F" stroke-width="1.8"/>
    <!-- Lower warm anime catchglow -->
    <ellipse cx="460" cy="368" rx="14" ry="9" fill="url(#ir_glow)"/>
    <!-- Pupil -->
    <ellipse cx="460" cy="356" rx="8.2" ry="10.2" fill="#2A142B"/>
    <!-- Upper shadow band -->
    <path d="M 441 348 C 445 332, 475 332, 479 348 C 472 342, 448 342, 441 348 Z" fill="#2A142B" opacity="0.45"/>
    <!-- Crisp specular highlights (consistent upper-left key light) -->
    <ellipse cx="451" cy="345" rx="5.8" ry="6.6" fill="#FFFFFF" opacity="0.96"/>
    <circle cx="469" cy="365" r="2.8" fill="#FFFFFF" opacity="0.88"/>
    <circle cx="467" cy="343" r="1.7" fill="#FFF7F0" opacity="0.85"/>
  </g>
</svg>
